name: livingwiki_mobile
description: LivingWiki — a world worth knowing. The native companion for curious people.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.11.0
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: 4.4.0
  firebase_auth: 6.1.4
  cloud_firestore: 6.1.2
  cloud_functions: 6.0.6
  firebase_storage: 13.0.6
  google_sign_in: ^7.2.0
  shared_preferences: ^2.5.4
  url_launcher: ^6.3.2
  share_plus: ^12.0.1
  flutter_markdown: ^0.7.7+1
  file_picker: ^10.3.10
  video_player: ^2.10.1
  audioplayers: ^6.5.1
  http: ^1.6.0
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  app_links: ^6.4.1
  elevenlabs_agents: 0.6.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  fake_cloud_firestore: ^4.0.0
  firebase_auth_mocks: ^0.15.0
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Newsreader
      fonts:
        - asset: assets/fonts/newsreader-regular.ttf
        - asset: assets/fonts/newsreader-italic.ttf
          style: italic
